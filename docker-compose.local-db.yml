services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omnisync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnisync_secret}
      POSTGRES_DB: ${POSTGRES_DB:-omnisync_wms}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omnisync}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth:
    depends_on:
      postgres:
        condition: service_healthy

  wms:
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
