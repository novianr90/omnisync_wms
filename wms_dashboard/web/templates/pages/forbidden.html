{{define "content"}}
<div class="p-6 flex items-center justify-center min-h-[80vh]">
    <div class="glass-panel p-8 max-w-md rounded-2xl border border-rose-900/40 shadow-2xl flex flex-col items-center text-center gap-5 relative overflow-hidden">
        <!-- Background radial glow -->
        <div class="absolute -top-12 -left-12 w-32 h-32 bg-rose-500/10 rounded-full blur-2xl"></div>
        <div class="absolute -bottom-12 -right-12 w-32 h-32 bg-rose-500/10 rounded-full blur-2xl"></div>

        <!-- Lock Icon Box -->
        <div class="w-16 h-16 rounded-2xl bg-rose-950/40 border border-rose-900/40 flex items-center justify-center text-rose-400 shadow-inner">
            <i data-lucide="shield-alert" class="w-8 h-8"></i>
        </div>

        <div class="flex flex-col gap-2">
            <h3 class="font-bold text-xl text-slate-100 font-outfit tracking-wide">Access Denied</h3>
            <p class="text-xs text-slate-400 leading-relaxed px-2">
                {{if .ErrorMessage}}
                    {{.ErrorMessage}}
                {{else}}
                    You do not have the required permission settings to access this system module. Please contact your system administrator.
                {{end}}
            </p>
        </div>

        <div class="w-full border-t border-slate-800/80 my-2"></div>

        <a href="/" hx-get="/" hx-target="#main-workspace" hx-push-url="true"
           class="w-full py-2 bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 text-slate-300 hover:text-white font-semibold text-xs rounded-lg active:scale-95 transition cursor-pointer flex items-center justify-center gap-2">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span>Return to Dashboard</span>
        </a>
    </div>
</div>
{{end}}
