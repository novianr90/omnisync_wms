{{define "content"}}
<div class="p-6 flex flex-col gap-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <div class="flex items-center gap-2 text-xs text-slate-400 font-medium uppercase tracking-wider mb-1">
                <span>System Administration</span>
                <i data-lucide="chevron-right" class="w-3 h-3 text-slate-600"></i>
                <span class="text-rose-400">System Users</span>
            </div>
            <h3 class="font-bold text-xl text-slate-100 font-outfit">User Account Registry</h3>
            <p class="text-xs text-slate-400 mt-0.5">Manage operator accounts, access credentials, and active states</p>
        </div>
        
        <button onclick="document.getElementById('new-user-modal').classList.remove('hidden')"
                class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white font-semibold text-xs rounded-lg active:translate-y-[1px] shadow-lg shadow-rose-500/10 cursor-pointer flex items-center gap-2 transition duration-200">
            <i data-lucide="user-plus" class="w-3.5 h-3.5"></i>
            <span>Add New User</span>
        </button>
    </div>

    <div class="glass-panel p-5 rounded-2xl border border-slate-800/80 shadow-xl flex flex-col gap-5">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="relative w-full max-w-md">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
                    <i data-lucide="search" class="w-4 h-4"></i>
                </span>
                <input type="text" id="user-search" onkeyup="filterUsers()" 
                       placeholder="Search users by name, email, or role..."
                       class="w-full pl-10 pr-4 py-2 rounded-lg bg-slate-950/60 border border-slate-800 text-slate-200 text-xs placeholder:text-slate-600 focus:outline-none focus:border-rose-500 transition duration-200">
            </div>

            <div class="flex items-center gap-3">
                <span class="bg-rose-950/40 text-rose-400 border border-rose-900/60 px-3 py-1 rounded-full text-[10px] font-semibold uppercase tracking-wider">
                    Total Users: {{len .Users}}
                </span>
            </div>
        </div>

        <div class="overflow-x-auto border border-slate-800/80 rounded-xl bg-slate-950/20">
            <table class="w-full border-collapse text-left text-xs">
                <thead>
                    <tr class="border-b border-slate-800 bg-slate-950/60 font-semibold tracking-wider text-slate-400 uppercase">
                        <th class="px-6 py-4">Name</th>
                        <th class="px-6 py-4">Email</th>
                        <th class="px-6 py-4">Assigned Role</th>
                        <th class="px-6 py-4 text-center">Status</th>
                        <th class="px-6 py-4 w-28 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="users-tbody" class="divide-y divide-slate-800/60"
                       hx-get="/wms/system/users/rows" 
                       hx-trigger="refreshUsersList from:body" 
                       hx-target="#users-tbody">
                    {{template "user_rows" .}}
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add User Modal -->
<div id="new-user-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
    <div class="glass-panel w-full max-w-md rounded-2xl border border-slate-800 shadow-2xl flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-200">
        <div class="h-14 px-6 border-b border-slate-800 flex items-center justify-between bg-slate-900/50">
            <h3 class="font-bold text-slate-200 flex items-center gap-2">
                <i data-lucide="user-plus" class="w-4 h-4 text-rose-400"></i>
                Register New User
            </h3>
            <button onclick="document.getElementById('new-user-modal').classList.add('hidden')" class="text-slate-500 hover:text-slate-300">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        
        <form hx-post="/wms/system/users" hx-target="#toast-container" hx-swap="beforeend" 
              onsubmit="setTimeout(() => document.getElementById('new-user-modal').classList.add('hidden'), 100)" class="p-6 flex flex-col gap-4">
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold tracking-wide text-slate-400 mb-1.5 uppercase">First Name</label>
                    <input type="text" name="first_name" required placeholder="John"
                           class="w-full px-3 py-2 bg-slate-950/50 border border-slate-800 rounded-lg text-slate-200 text-sm focus:outline-none focus:border-rose-500 transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-semibold tracking-wide text-slate-400 mb-1.5 uppercase">Last Name</label>
                    <input type="text" name="last_name" required placeholder="Doe"
                           class="w-full px-3 py-2 bg-slate-950/50 border border-slate-800 rounded-lg text-slate-200 text-sm focus:outline-none focus:border-rose-500 transition-colors">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold tracking-wide text-slate-400 mb-1.5 uppercase">Email Address</label>
                <input type="email" name="email" required placeholder="john.doe@company.com"
                       class="w-full px-3 py-2 bg-slate-950/50 border border-slate-800 rounded-lg text-slate-200 text-sm focus:outline-none focus:border-rose-500 transition-colors">
            </div>

            <div>
                <label class="block text-xs font-semibold tracking-wide text-slate-400 mb-1.5 uppercase">Password</label>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full px-3 py-2 bg-slate-950/50 border border-slate-800 rounded-lg text-slate-200 text-sm focus:outline-none focus:border-rose-500 transition-colors">
            </div>

            <div>
                <label class="block text-xs font-semibold tracking-wide text-slate-400 mb-1.5 uppercase">Assign Role</label>
                <select name="role" required class="w-full px-3 py-2 bg-slate-950/50 border border-slate-800 rounded-lg text-slate-200 text-sm focus:outline-none focus:border-rose-500 transition-colors appearance-none">
                    {{range .Roles}}
                    <option value="{{.Name}}">{{.Name}}</option>
                    {{end}}
                </select>
            </div>

            <div class="mt-4 flex gap-3 justify-end">
                <button type="button" onclick="document.getElementById('new-user-modal').classList.add('hidden')" class="px-4 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-lg text-xs font-semibold shadow-lg shadow-rose-500/20 active:translate-y-[1px] transition">Create User</button>
            </div>
        </form>
    </div>
</div>

<script>
    function filterUsers() {
        const query = document.getElementById('user-search').value.toLowerCase();
        const rows = document.querySelectorAll('#users-tbody tr');
        
        rows.forEach(row => {
            if (row.cells.length < 3) return;
            const name = row.cells[0]?.textContent.toLowerCase() || '';
            const email = row.cells[1]?.textContent.toLowerCase() || '';
            const role = row.cells[2]?.textContent.toLowerCase() || '';

            if (name.includes(query) || email.includes(query) || role.includes(query)) {
                row.style.display = '';
            } else {
                row.style.display = 'none';
            }
        });
    }
</script>
{{end}}
