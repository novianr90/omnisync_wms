{{define "content"}}
<div class="p-6 flex flex-col gap-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <div class="flex items-center gap-2 text-xs text-slate-400 font-medium uppercase tracking-wider mb-1">
                <span>WMS Operations</span>
                <i data-lucide="chevron-right" class="w-3 h-3 text-slate-600"></i>
                <span class="text-indigo-400">Inventory Movements</span>
            </div>
            <h3 class="font-bold text-xl text-slate-100 font-outfit">Inventory Movements</h3>
            <p class="text-xs text-slate-400 mt-0.5">View and manage inbound receipts, outbound picks, and transaction lifecycle</p>
        </div>
        
        <a href="/wms/movements/new" hx-get="/wms/movements/new" hx-target="#main-workspace" hx-push-url="true"
           class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs rounded-lg active:translate-y-[1px] shadow-lg shadow-indigo-500/10 cursor-pointer flex items-center gap-2 transition duration-200">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            <span>Register Movement</span>
        </a>
    </div>

    <div class="glass-panel p-5 rounded-2xl border border-slate-800/80 shadow-xl flex flex-col gap-5">
        <!-- Filter Form -->
        <form hx-get="/wms/movements" hx-target="#movements-tbody" hx-trigger="change, keyup delay:300ms from:#search-input" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
            <!-- Search -->
            <div class="flex flex-col gap-1.5">
                <label class="text-[10px] font-bold text-slate-400 tracking-wider uppercase">Search</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
                        <i data-lucide="search" class="w-3.5 h-3.5"></i>
                    </span>
                    <input type="text" id="search-input" name="search" placeholder="Doc No, SKU, Name..."
                           class="w-full pl-9 pr-3 py-1.5 rounded-lg bg-slate-950/60 border border-slate-800 text-slate-200 text-xs focus:outline-none focus:border-indigo-500 transition">
                </div>
            </div>

            <!-- Type -->
            <div class="flex flex-col gap-1.5">
                <label class="text-[10px] font-bold text-slate-400 tracking-wider uppercase">Movement Type</label>
                <select name="type" class="w-full px-3 py-1.5 rounded-lg bg-slate-950/60 border border-slate-800 text-slate-200 text-xs focus:outline-none focus:border-indigo-500 transition">
                    <option value="">-- All Types --</option>
                    <option value="INBOUND">Inbound</option>
                    <option value="OUTBOUND">Outbound</option>
                    <option value="RTV">Return to Vendor</option>
                </select>
            </div>

            <!-- Status -->
            <div class="flex flex-col gap-1.5">
                <label class="text-[10px] font-bold text-slate-400 tracking-wider uppercase">Status</label>
                <select name="status" class="w-full px-3 py-1.5 rounded-lg bg-slate-950/60 border border-slate-800 text-slate-200 text-xs focus:outline-none focus:border-indigo-500 transition">
                    <option value="">-- All Status --</option>
                    <option value="OPEN">Open</option>
                    <option value="IN_PROGRESS">In Progress</option>
                    <option value="JOURNALED">Journaled</option>
                    <option value="COMPLETED">Completed</option>
                    <option value="REJECTED">Rejected</option>
                </select>
            </div>

            <!-- Start Date -->
            <div class="flex flex-col gap-1.5">
                <label class="text-[10px] font-bold text-slate-400 tracking-wider uppercase">Start Date</label>
                <input type="date" name="start_date" class="w-full px-3 py-1.5 rounded-lg bg-slate-950/60 border border-slate-800 text-slate-200 text-xs focus:outline-none focus:border-indigo-500 transition">
            </div>

            <!-- End Date -->
            <div class="flex flex-col gap-1.5">
                <label class="text-[10px] font-bold text-slate-400 tracking-wider uppercase">End Date</label>
                <input type="date" name="end_date" class="w-full px-3 py-1.5 rounded-lg bg-slate-950/60 border border-slate-800 text-slate-200 text-xs focus:outline-none focus:border-indigo-500 transition">
            </div>
        </form>

        <div class="overflow-x-auto border border-slate-800/80 rounded-xl bg-slate-950/20">
            <table class="w-full border-collapse text-left text-xs">
                <thead>
                    <tr class="border-b border-slate-800 bg-slate-950/60 font-semibold tracking-wider text-slate-400 uppercase">
                        <th class="px-6 py-4">Document No</th>
                        <th class="px-6 py-4">Created Date</th>
                        <th class="px-6 py-4">Type</th>
                        <th class="px-6 py-4">Line Items</th>
                        <th class="px-6 py-4">Status</th>
                        <th class="px-6 py-4 w-32 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="movements-tbody" class="divide-y divide-slate-800/60">
                    {{template "movements_table" .}}
                </tbody>
            </table>
        </div>
    </div>
</div>
{{end}}
