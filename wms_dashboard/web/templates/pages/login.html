<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Omnisync WMS</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS (compiled stylesheet) -->
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased">
    <!-- Dynamic alert area -->
    <div id="login-alert" class="fixed top-6 right-6 z-50 max-w-sm"></div>

    <!-- Login card container -->
    <div class="w-full max-w-md glass-panel p-8 rounded-2xl border border-slate-800 shadow-2xl relative neon-glow-card">
        <!-- Brand banner -->
        <div class="flex flex-col items-center gap-3 mb-8">
            <div class="w-12 h-12 rounded-xl bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <i data-lucide="package" class="w-6 h-6 text-white"></i>
            </div>
            <div class="text-center">
                <h1 class="font-bold text-2xl tracking-wider uppercase bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">Omnisync</h1>
                <span class="text-[10px] text-indigo-400 font-bold tracking-widest uppercase block mt-0.5">Warehouse Management Suite</span>
            </div>
        </div>

        <!-- Login Form -->
        <form hx-post="/auth/login-submit" 
              hx-target="#login-alert" 
              hx-swap="innerHTML"
              class="flex flex-col gap-5">
            <!-- Email Input -->
            <div class="flex flex-col gap-1.5">
                <label for="email" class="text-xs font-semibold text-slate-300 tracking-wide uppercase">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
                        <i data-lucide="mail" class="w-4 h-4"></i>
                    </span>
                    <input type="email" id="email" name="email" required placeholder="operator@omnisync.com"
                           class="w-full pl-10 pr-4 py-2.5 rounded-lg bg-slate-950/60 border border-slate-800 text-slate-200 text-sm placeholder:text-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition duration-200">
                </div>
            </div>

            <!-- Password Input -->
            <div class="flex flex-col gap-1.5">
                <div class="flex justify-between items-center">
                    <label for="password" class="text-xs font-semibold text-slate-300 tracking-wide uppercase">Password</label>
                    <a href="#" class="text-[10px] font-semibold text-indigo-400 hover:text-indigo-300 transition uppercase tracking-wider">Forgot?</a>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
                        <i data-lucide="lock" class="w-4 h-4"></i>
                    </span>
                    <input type="password" id="password" name="password" required placeholder="••••••••"
                           class="w-full pl-10 pr-4 py-2.5 rounded-lg bg-slate-950/60 border border-slate-800 text-slate-200 text-sm placeholder:text-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition duration-200">
                </div>
            </div>

            <!-- Submit Button with loading status indicator -->
            <button type="submit" 
                    class="w-full py-3 mt-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm tracking-wide shadow-lg shadow-indigo-500/20 active:translate-y-[1px] transition duration-200 cursor-pointer flex items-center justify-center gap-2">
                <span id="submit-text">Access Portal</span>
                <!-- Loading spinner (invisible by default, shown by HTMX on load) -->
                <svg id="loading" class="animate-spin h-4 w-4 text-white hidden htmx-indicator" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>

        <!-- Credentials Hint -->
        <div class="mt-8 pt-6 border-t border-slate-800/80 text-center">
            <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Local Sandbox Accounts</h4>
            <div class="flex flex-col gap-1 text-[11px] text-slate-500">
                <p><span class="font-medium text-slate-400">Admin:</span> admin@omnisync.com / admin123</p>
                <p><span class="font-medium text-slate-400">Operator:</span> operator@omnisync.com / operator123</p>
            </div>
        </div>
    </div>

    <!-- Lucide Icons initialization -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
