{{define "notification"}}
<div class="glass-panel p-4 rounded-xl shadow-xl flex items-start gap-3 border relative min-w-[300px] max-w-sm transition-all duration-300 {{if .Success}}border-emerald-500/30 bg-emerald-950/10{{else}}border-rose-500/30 bg-rose-950/10{{end}}" hx-swap-oob="afterbegin:#toast-container">
    <!-- Success/Failure Icon -->
    <div class="w-7 h-7 rounded-lg flex items-center justify-center shrink-0 shadow-inner {{if .Success}}bg-emerald-950/40 text-emerald-400 border border-emerald-900/40{{else}}bg-rose-950/40 text-rose-400 border border-rose-900/40{{end}}">
        {{if .Success}}
        <i data-lucide="check-circle" class="w-4 h-4"></i>
        {{else}}
        <i data-lucide="alert-triangle" class="w-4 h-4"></i>
        {{end}}
    </div>
    
    <!-- Text -->
    <div class="flex-1 min-w-0">
        <h5 class="text-[10px] font-bold tracking-wider uppercase {{if .Success}}text-emerald-400{{else}}text-rose-400{{end}}">
            {{if .Success}}Operation Succeeded{{else}}Operation Failed{{end}}
        </h5>
        <p class="text-[11px] text-slate-300 mt-0.5 leading-relaxed break-words">{{.Message}}</p>
    </div>
    
    <!-- Close button -->
    <button onclick="this.parentElement.remove()" class="text-slate-500 hover:text-slate-300 transition shrink-0 cursor-pointer">
        <i data-lucide="x" class="w-3.5 h-3.5"></i>
    </button>
</div>

<!-- Auto-initialize Lucide and set auto-fade timer -->
<script>
    lucide.createIcons();
    // Locate the dynamic notification card and auto-dismiss after 4 seconds
    (function() {
        const selfScript = document.currentScript;
        const card = selfScript.previousElementSibling;
        if (card) {
            setTimeout(() => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(-10px)';
                card.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
                setTimeout(() => card.remove(), 400);
            }, 4000);
        }
    })();
</script>
{{end}}
