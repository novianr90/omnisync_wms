{{define "notification"}}
<div hx-swap-oob="beforeend:#toast-container">
    <script>
        (function() {
            // Initialize Notyf globally if it doesn't exist
            if (!window.notyf) {
                window.notyf = new Notyf({
                    duration: 4000,
                    position: {x: 'right', y: 'top'},
                    dismissible: true,
                    ripple: true,
                    types: [
                        {
                            type: 'success',
                            background: '#10b981', // Tailwind emerald-500
                            icon: {
                                className: 'notyf__icon--success',
                                tagName: 'i',
                            }
                        },
                        {
                            type: 'error',
                            background: '#f43f5e', // Tailwind rose-500
                            duration: 8000,
                            icon: {
                                className: 'notyf__icon--error',
                                tagName: 'i',
                            }
                        }
                    ]
                });
            }
            
            // Trigger the notification
            {{if .Success}}
            window.notyf.success("{{.Message}}");
            {{else}}
            window.notyf.error("{{.Message}}");
            {{end}}
        })();
    </script>
</div>
{{end}}
