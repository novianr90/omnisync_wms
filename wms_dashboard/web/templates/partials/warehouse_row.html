{{define "warehouse_rows"}}
{{range .Warehouses}}
<tr class="border-b border-slate-800/60 hover:bg-slate-900/20 text-slate-300 transition duration-150">
    <td class="px-6 py-4 font-mono text-[11px] font-bold text-emerald-400 select-all">{{.Code}}</td>
    <td class="px-6 py-4 font-semibold text-slate-200">{{.Name}}</td>
    <td class="px-6 py-4 text-slate-400 max-w-sm truncate" title="{{.Address}}">{{if .Address}}{{.Address}}{{else}}<span class="text-slate-600 italic">No address provided</span>{{end}}</td>
    <td class="px-6 py-4 text-center">
        {{if .IsActive}}
        <span class="px-2 py-0.5 rounded text-[9px] font-bold bg-emerald-950/40 text-emerald-400 border border-emerald-900/40 uppercase tracking-widest">
            Active
        </span>
        {{else}}
        <span class="px-2 py-0.5 rounded text-[9px] font-bold bg-rose-950/40 text-rose-400 border border-rose-900/40 uppercase tracking-widest">
            Inactive
        </span>
        {{end}}
    </td>
    {{if eq $.UserRole "admin"}}
    <td class="px-6 py-4">
        <div class="flex items-center justify-center gap-2">
            <button hx-get="/wms/masters/warehouses/{{.ID}}/edit" hx-target="#modal-container"
                    class="p-1.5 rounded bg-slate-900 hover:bg-slate-800 border border-slate-800 text-emerald-400 hover:text-emerald-300 transition cursor-pointer" 
                    title="Edit Facility Details">
                <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
            </button>
            <button hx-delete="/wms/masters/warehouses/{{.ID}}" 
                    hx-confirm="Attention: Deleting this warehouse will soft-delete the record. Relational checks prevent deletion if shelves are still allocated. Continue?"
                    class="p-1.5 rounded bg-slate-900 hover:bg-rose-950/40 border border-slate-800 text-rose-500 hover:text-rose-400 transition cursor-pointer" 
                    title="Delete Facility Node">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>
        </div>
    </td>
    {{end}}
</tr>
{{else}}
<tr>
    <td colspan="{{if eq .UserRole "admin"}}5{{else}}4{{end}}" class="px-6 py-12 text-center text-slate-500">
        <div class="flex flex-col items-center justify-center gap-2">
            <i data-lucide="inbox" class="w-8 h-8 opacity-40"></i>
            <span class="text-xs">No warehouse hubs registered.</span>
        </div>
    </td>
</tr>
{{end}}
<script>
    lucide.createIcons();
</script>
{{end}}
