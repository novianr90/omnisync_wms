{{define "warehouse_modal_new"}}
<div id="new-warehouse-modal" class="fixed inset-0 z-40 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4">
    <!-- Modal panel -->
    <div class="w-full max-w-lg glass-panel p-6 rounded-2xl border border-slate-800 shadow-2xl relative flex flex-col gap-4">
        
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <h4 class="font-bold text-sm text-slate-100 flex items-center gap-2 uppercase tracking-wider font-outfit">
                <i data-lucide="building" class="w-4 h-4 text-emerald-400"></i>
                <span>Register Warehouse facility</span>
            </h4>
            <button onclick="closeWarehouseModal()" class="p-1 rounded-lg text-slate-500 hover:bg-slate-900 hover:text-slate-300 transition cursor-pointer">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Form -->
        <form hx-post="/wms/masters/warehouses" class="flex flex-col gap-4">
            
            <div class="grid grid-cols-3 gap-4">
                <!-- Warehouse Code -->
                <div class="flex flex-col gap-1.5 col-span-1">
                    <label for="wh-code" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Facility Code</label>
                    <input type="text" id="wh-code" name="code" required placeholder="WH-MAIN"
                           class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-200 text-xs uppercase focus:outline-none focus:border-emerald-500 transition">
                </div>

                <!-- Warehouse Name -->
                <div class="flex flex-col gap-1.5 col-span-2">
                    <label for="wh-name" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Facility Name</label>
                    <input type="text" id="wh-name" name="name" required placeholder="Central Logistics Hub"
                           class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-200 text-xs focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <!-- Address -->
            <div class="flex flex-col gap-1.5">
                <label for="wh-addr" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Physical Street Address / Location</label>
                <textarea id="wh-addr" name="address" rows="3" placeholder="Golden Gate Sector 4, Silicon Valley"
                          class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-200 text-xs placeholder:text-slate-700 focus:outline-none focus:border-emerald-500 transition"></textarea>
            </div>

            <!-- Action buttons -->
            <div class="flex items-center justify-end gap-3 mt-2 pt-3 border-t border-slate-800/60">
                <button type="button" onclick="closeWarehouseModal()"
                        class="px-4 py-2 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 font-semibold text-xs transition cursor-pointer">
                    Cancel
                </button>
                <button type="submit" 
                        class="px-5 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs tracking-wider shadow-lg shadow-emerald-500/10 cursor-pointer transition">
                    Save Facility Hub
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    lucide.createIcons();
    
    function closeWarehouseModal() {
        document.getElementById('modal-container').innerHTML = '';
    }

    // Auto close on success trigger
    document.body.addEventListener('refreshWarehousesList', closeWarehouseModal, { once: true });
</script>
{{end}}


{{define "warehouse_modal_edit"}}
<div id="edit-warehouse-modal" class="fixed inset-0 z-40 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4">
    <!-- Modal panel -->
    <div class="w-full max-w-lg glass-panel p-6 rounded-2xl border border-slate-800 shadow-2xl relative flex flex-col gap-4">
        
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <h4 class="font-bold text-sm text-slate-100 flex items-center gap-2 uppercase tracking-wider font-outfit">
                <i data-lucide="edit-3" class="w-4 h-4 text-emerald-400"></i>
                <span>Edit Warehouse facility</span>
            </h4>
            <button onclick="closeWarehouseModal()" class="p-1 rounded-lg text-slate-500 hover:bg-slate-900 hover:text-slate-300 transition cursor-pointer">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Form -->
        <form hx-put="/wms/masters/warehouses/{{.Warehouse.ID}}" class="flex flex-col gap-4">
            
            <div class="grid grid-cols-3 gap-4">
                <!-- Warehouse Code -->
                <div class="flex flex-col gap-1.5 col-span-1">
                    <label for="wh-code" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Facility Code</label>
                    <input type="text" id="wh-code" name="code" required value="{{.Warehouse.Code}}"
                           class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-200 text-xs uppercase focus:outline-none focus:border-emerald-500 transition">
                </div>

                <!-- Warehouse Name -->
                <div class="flex flex-col gap-1.5 col-span-2">
                    <label for="wh-name" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Facility Name</label>
                    <input type="text" id="wh-name" name="name" required value="{{.Warehouse.Name}}"
                           class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-200 text-xs focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <!-- Operational Status Toggle -->
            <div class="flex flex-col gap-1.5">
                <label for="wh-active" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Operational Status</label>
                <select id="wh-active" name="is_active" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-200 text-xs focus:outline-none focus:border-emerald-500 transition">
                    <option value="true" {{if .Warehouse.IsActive}}selected{{end}}>Active Hub (Permits storage operations)</option>
                    <option value="false" {{if not .Warehouse.IsActive}}selected{{end}}>Inactive Hub (Locks storage operations)</option>
                </select>
            </div>

            <!-- Address -->
            <div class="flex flex-col gap-1.5">
                <label for="wh-addr" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Physical Street Address / Location</label>
                <textarea id="wh-addr" name="address" rows="3"
                          class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-200 text-xs placeholder:text-slate-700 focus:outline-none focus:border-emerald-500 transition">{{.Warehouse.Address}}</textarea>
            </div>

            <!-- Action buttons -->
            <div class="flex items-center justify-end gap-3 mt-2 pt-3 border-t border-slate-800/60">
                <button type="button" onclick="closeWarehouseModal()"
                        class="px-4 py-2 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 font-semibold text-xs transition cursor-pointer">
                    Cancel
                </button>
                <button type="submit" 
                        class="px-5 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs tracking-wider shadow-lg shadow-emerald-500/10 cursor-pointer transition">
                    Update Facility
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    lucide.createIcons();
    
    function closeWarehouseModal() {
        document.getElementById('modal-container').innerHTML = '';
    }

    // Auto close on success trigger
    document.body.addEventListener('refreshWarehousesList', closeWarehouseModal, { once: true });
</script>
{{end}}
