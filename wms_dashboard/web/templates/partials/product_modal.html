{{define "product_modal_new"}}
<div id="new-product-modal" class="fixed inset-0 z-40 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4">
    <!-- Modal panel -->
    <div class="w-full max-w-lg glass-panel p-6 rounded-2xl border border-slate-800 shadow-2xl relative flex flex-col gap-4">
        
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <h4 class="font-bold text-sm text-slate-100 flex items-center gap-2 uppercase tracking-wider font-outfit">
                <i data-lucide="tag" class="w-4 h-4 text-indigo-400"></i>
                <span>Register New SKU Product</span>
            </h4>
            <button onclick="closeProductModal()" class="p-1 rounded-lg text-slate-500 hover:bg-slate-900 hover:text-slate-300 transition cursor-pointer">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Form -->
        <form hx-post="/wms/masters/products" class="flex flex-col gap-4">
            
            <div class="grid grid-cols-2 gap-4">
                <!-- SKU Code -->
                <div class="flex flex-col gap-1.5">
                    <label for="prod-sku" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">SKU Code (Required)</label>
                    <input type="text" id="prod-sku" name="sku" required placeholder="PROD-ITEM-99"
                           class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-200 text-xs uppercase focus:outline-none focus:border-indigo-500 transition">
                </div>

                <!-- Product Name -->
                <div class="flex flex-col gap-1.5">
                    <label for="prod-name" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Product Name</label>
                    <input type="text" id="prod-name" name="name" required placeholder="Keychron Keyboards"
                           class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-200 text-xs focus:outline-none focus:border-indigo-500 transition">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <!-- Category -->
                <div class="flex flex-col gap-1.5">
                    <label for="prod-cat" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Category</label>
                    <input type="text" id="prod-cat" name="category" placeholder="Electronics"
                           class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-200 text-xs focus:outline-none focus:border-indigo-500 transition">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <!-- Is Bundle -->
                <div class="flex flex-col gap-1.5 justify-center">
                    <label class="flex items-center gap-2 cursor-pointer mt-5">
                        <input type="checkbox" id="prod-is-bundle" name="is_bundle" value="true" onchange="togglePriceInput(this.checked, 'prod-price-container')"
                               class="w-4 h-4 rounded border-slate-800 bg-slate-950 text-indigo-500 focus:ring-indigo-500 focus:ring-offset-slate-900 transition">
                        <span class="text-[11px] font-bold text-slate-300 uppercase tracking-wider">Is Bundle Product?</span>
                    </label>
                </div>

                <!-- Unit Price -->
                <div class="flex flex-col gap-1.5" id="prod-price-container">
                    <label for="prod-price" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Unit Price (USD)</label>
                    <input type="number" id="prod-price" name="price" step="0.01" min="0" placeholder="99.99"
                           class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-200 text-xs focus:outline-none focus:border-indigo-500 transition">
                </div>
                <div class="flex flex-col gap-1.5 hidden justify-center mt-5" id="prod-price-info">
                    <span class="text-[10px] text-fuchsia-400 italic"><i data-lucide="info" class="w-3 h-3 inline"></i> Bundle price is auto-calculated during kitting.</span>
                </div>
            </div>

            <!-- Base UoM Selection -->
            <div class="flex flex-col gap-1.5">
                <label for="prod-uom" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Base Unit of Measure</label>
                <select id="prod-uom" name="uom_id" required
                        class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-200 text-xs focus:outline-none focus:border-indigo-500 transition">
                    <option value="" disabled selected>-- Select Base Unit --</option>
                    {{range .UoMs}}
                    <option value="{{.ID}}">{{.Code}} - {{.Name}}</option>
                    {{end}}
                </select>
            </div>

            <!-- Description -->
            <div class="flex flex-col gap-1.5">
                <label for="prod-desc" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Product Specifications & Description</label>
                <textarea id="prod-desc" name="description" rows="3" placeholder="Add technical dimensions, product parameters, or storage guidelines..."
                          class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-200 text-xs placeholder:text-slate-700 focus:outline-none focus:border-indigo-500 transition"></textarea>
            </div>

            <!-- Action buttons -->
            <div class="flex items-center justify-end gap-3 mt-2 pt-3 border-t border-slate-800/60">
                <button type="button" onclick="closeProductModal()"
                        class="px-4 py-2 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 font-semibold text-xs transition cursor-pointer">
                    Cancel
                </button>
                <button type="submit" 
                        class="px-5 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs tracking-wider shadow-lg shadow-indigo-500/10 cursor-pointer transition">
                    Save Product SKU
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    lucide.createIcons();
    
    function closeProductModal() {
        document.getElementById('modal-container').innerHTML = '';
    }

    // Auto close only on successful save event
    document.body.addEventListener('refreshProductsList', closeProductModal, { once: true });

    function togglePriceInput(isBundle, containerId) {
        const priceContainer = document.getElementById(containerId);
        const infoContainer = priceContainer.nextElementSibling;
        const priceInput = priceContainer.querySelector('input');
        
        if (isBundle) {
            priceContainer.classList.add('hidden');
            infoContainer.classList.remove('hidden');
            priceInput.value = '0';
        } else {
            priceContainer.classList.remove('hidden');
            infoContainer.classList.add('hidden');
        }
    }
</script>
{{end}}


{{define "product_modal_edit"}}
<div id="edit-product-modal" class="fixed inset-0 z-40 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4">
    <!-- Modal panel -->
    <div class="w-full max-w-lg glass-panel p-6 rounded-2xl border border-slate-800 shadow-2xl relative flex flex-col gap-4">
        
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <h4 class="font-bold text-sm text-slate-100 flex items-center gap-2 uppercase tracking-wider font-outfit">
                <i data-lucide="edit-3" class="w-4 h-4 text-indigo-400"></i>
                <span>Edit Product Master</span>
            </h4>
            <button onclick="closeProductModal()" class="p-1 rounded-lg text-slate-500 hover:bg-slate-900 hover:text-slate-300 transition cursor-pointer">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Form -->
        <form hx-put="/wms/masters/products/{{.Product.ID}}" class="flex flex-col gap-4">
            
            <div class="grid grid-cols-2 gap-4">
                <!-- SKU Code -->
                <div class="flex flex-col gap-1.5">
                    <label for="prod-sku" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">SKU Code (Required)</label>
                    <input type="text" id="prod-sku" name="sku" required value="{{.Product.SKU}}"
                           class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-200 text-xs uppercase focus:outline-none focus:border-indigo-500 transition">
                </div>

                <!-- Product Name -->
                <div class="flex flex-col gap-1.5">
                    <label for="prod-name" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Product Name</label>
                    <input type="text" id="prod-name" name="name" required value="{{.Product.Name}}"
                           class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-200 text-xs focus:outline-none focus:border-indigo-500 transition">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <!-- Category -->
                <div class="flex flex-col gap-1.5">
                    <label for="edit-prod-cat" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Category</label>
                    <input type="text" id="edit-prod-cat" name="category" value="{{.Product.Category}}"
                           class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-200 text-xs focus:outline-none focus:border-indigo-500 transition">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <!-- Is Bundle -->
                <div class="flex flex-col gap-1.5 justify-center">
                    <label class="flex items-center gap-2 cursor-pointer mt-5">
                        <input type="checkbox" id="edit-prod-is-bundle" name="is_bundle" value="true" onchange="toggleEditPriceInput(this.checked)" {{if .Product.IsBundle}}checked{{end}}
                               class="w-4 h-4 rounded border-slate-800 bg-slate-950 text-indigo-500 focus:ring-indigo-500 focus:ring-offset-slate-900 transition">
                        <span class="text-[11px] font-bold text-slate-300 uppercase tracking-wider">Is Bundle Product?</span>
                    </label>
                </div>

                <!-- Unit Price -->
                <div class="flex flex-col gap-1.5 {{if .Product.IsBundle}}hidden{{end}}" id="edit-prod-price-container">
                    <label for="edit-prod-price" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Unit Price (USD)</label>
                    <input type="number" id="edit-prod-price" name="price" step="0.01" min="0" value="{{.Product.Price}}"
                           class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-200 text-xs focus:outline-none focus:border-indigo-500 transition">
                </div>
                <div class="flex flex-col gap-1.5 {{if not .Product.IsBundle}}hidden{{end}} justify-center mt-5" id="edit-prod-price-info">
                    <span class="text-[10px] text-fuchsia-400 italic"><i data-lucide="info" class="w-3 h-3 inline"></i> Bundle price is auto-calculated during kitting.</span>
                </div>
            </div>

            <!-- Base UoM Selection -->
            <div class="flex flex-col gap-1.5">
                <label for="prod-uom" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Base Unit of Measure</label>
                <select id="prod-uom" name="uom_id" required
                        class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-200 text-xs focus:outline-none focus:border-indigo-500 transition">
                    {{range .UoMs}}
                    <option value="{{.ID}}" {{if eq .ID $.Product.UoMID}}selected{{end}}>{{.Code}} - {{.Name}}</option>
                    {{end}}
                </select>
            </div>

            <!-- Description -->
            <div class="flex flex-col gap-1.5">
                <label for="prod-desc" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Product Specifications & Description</label>
                <textarea id="prod-desc" name="description" rows="3"
                          class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-200 text-xs placeholder:text-slate-700 focus:outline-none focus:border-indigo-500 transition">{{.Product.Description}}</textarea>
            </div>

            <!-- Action buttons -->
            <div class="flex items-center justify-end gap-3 mt-2 pt-3 border-t border-slate-800/60">
                <button type="button" onclick="closeProductModal()"
                        class="px-4 py-2 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 font-semibold text-xs transition cursor-pointer">
                    Cancel
                </button>
                <button type="submit" 
                        class="px-5 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs tracking-wider shadow-lg shadow-indigo-500/10 cursor-pointer transition">
                    Update Product
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    lucide.createIcons();
    
    function closeProductModal() {
        document.getElementById('modal-container').innerHTML = '';
    }

    // Auto close only on successful save event
    document.body.addEventListener('refreshProductsList', closeProductModal, { once: true });

    function toggleEditPriceInput(isBundle) {
        const priceContainer = document.getElementById('edit-prod-price-container');
        const infoContainer = document.getElementById('edit-prod-price-info');
        const priceInput = document.getElementById('edit-prod-price');
        
        if (isBundle) {
            priceContainer.classList.add('hidden');
            infoContainer.classList.remove('hidden');
            priceInput.value = '0';
        } else {
            priceContainer.classList.remove('hidden');
            infoContainer.classList.add('hidden');
        }
    }
</script>
{{end}}
