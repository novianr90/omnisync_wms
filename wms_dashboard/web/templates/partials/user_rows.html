{{define "user_rows"}}
{{range .Users}}
<tr class="hover:bg-slate-900/30 transition-colors group">
    <td class="px-6 py-4">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center text-rose-400 font-bold">
                {{printf "%.1s%.1s" .FirstName .LastName}}
            </div>
            <div>
                <div class="font-medium text-slate-200">{{.FirstName}} {{.LastName}}</div>
                <div class="text-[10px] text-slate-500 font-mono mt-0.5">{{.ID}}</div>
            </div>
        </div>
    </td>
    <td class="px-6 py-4 text-slate-300">
        {{.Email}}
    </td>
    <td class="px-6 py-4">
        <span class="inline-flex items-center px-2 py-1 rounded-md text-[10px] font-semibold bg-slate-800 text-slate-300 border border-slate-700">
            {{.Role.Name}}
        </span>
    </td>
    <td class="px-6 py-4 text-center">
        {{if .IsActive}}
            <span class="inline-flex items-center gap-1.5 px-2 py-1 rounded-full text-[10px] font-bold tracking-wider uppercase bg-emerald-950/40 text-emerald-400 border border-emerald-900/60">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Active
            </span>
        {{else}}
            <span class="inline-flex items-center gap-1.5 px-2 py-1 rounded-full text-[10px] font-bold tracking-wider uppercase bg-rose-950/40 text-rose-400 border border-rose-900/60">
                <span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span> Disabled
            </span>
        {{end}}
    </td>
    <td class="px-6 py-4">
        <div class="flex items-center justify-center gap-2">
            {{if .IsActive}}
            <button hx-put="/wms/system/users/{{.ID}}/status" hx-vals='{"is_active": "false"}' hx-swap="none"
                    class="p-1.5 text-slate-400 hover:text-amber-400 hover:bg-amber-400/10 rounded-md transition tooltip" title="Disable User">
                <i data-lucide="user-x" class="w-4 h-4"></i>
            </button>
            {{else}}
            <button hx-put="/wms/system/users/{{.ID}}/status" hx-vals='{"is_active": "true"}' hx-swap="none"
                    class="p-1.5 text-slate-400 hover:text-emerald-400 hover:bg-emerald-400/10 rounded-md transition tooltip" title="Enable User">
                <i data-lucide="user-check" class="w-4 h-4"></i>
            </button>
            {{end}}
        </div>
    </td>
</tr>
{{else}}
<tr>
    <td colspan="5" class="px-6 py-12 text-center text-slate-500">
        <div class="flex flex-col items-center justify-center gap-2">
            <i data-lucide="users" class="w-8 h-8 opacity-50"></i>
            <p>No users found in the system registry.</p>
        </div>
    </td>
</tr>
{{end}}
{{end}}
