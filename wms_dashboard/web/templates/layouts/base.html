{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omnisync WMS Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS (compiled stylesheet) -->
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="min-h-screen flex flex-col antialiased">
    <!-- Dynamic Alert Banner Toast Area -->
    <div id="toast-container" class="fixed top-6 right-6 z-50 flex flex-col gap-3"></div>

    <!-- Main Outer Container -->
    <div class="flex-1 flex overflow-hidden h-screen">
        <!-- Sidebar Navigation -->
        <aside class="w-64 glass-panel border-r border-slate-800/80 flex flex-col justify-between hidden md:flex">
            <div>
                <!-- Brand logo -->
                <div class="h-16 px-6 flex items-center gap-3 border-b border-slate-800/60 bg-slate-950/20">
                    <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                        <i data-lucide="package" class="w-4 h-4 text-white"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-sm tracking-wider uppercase bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">Omnisync</h1>
                        <span class="text-[9px] text-indigo-400 font-bold tracking-widest uppercase block">WMS Suite</span>
                    </div>
                </div>

                <!-- Navigation List -->
                <nav class="p-4 flex flex-col gap-1.5">
                    <a href="/" hx-get="/" hx-target="#main-workspace" hx-push-url="true" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-900/40 transition duration-200 cursor-pointer">
                        <i data-lucide="layout-dashboard" class="w-4 h-4 text-indigo-400"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-900/40 transition duration-200">
                        <i data-lucide="arrow-down-left" class="w-4 h-4 text-emerald-500"></i>
                        <span>Inbound Receipts</span>
                    </a>
                    <a href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-900/40 transition duration-200">
                        <i data-lucide="arrow-up-right" class="w-4 h-4 text-indigo-500"></i>
                        <span>Outbound Picks</span>
                    </a>
                    <a href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-900/40 transition duration-200">
                        <i data-lucide="database" class="w-4 h-4 text-amber-500"></i>
                        <span>Master Storage</span>
                    </a>

                    <!-- MASTER DATA GROUP HEADER -->
                    <div class="px-4 pt-4 pb-1.5 text-[9px] font-bold text-slate-500 tracking-widest uppercase">Master Data</div>
                    
                    <a href="/wms/masters/products" hx-get="/wms/masters/products" hx-target="#main-workspace" hx-push-url="true" class="flex items-center gap-3 px-4 py-2 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-900/40 transition duration-200 cursor-pointer pl-6">
                        <i data-lucide="tag" class="w-3.5 h-3.5 text-indigo-400"></i>
                        <span>Products</span>
                    </a>
                    <a href="/wms/masters/warehouses" hx-get="/wms/masters/warehouses" hx-target="#main-workspace" hx-push-url="true" class="flex items-center gap-3 px-4 py-2 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-900/40 transition duration-200 cursor-pointer pl-6">
                        <i data-lucide="building" class="w-3.5 h-3.5 text-emerald-400"></i>
                        <span>Warehouses</span>
                    </a>
                    <a href="/wms/masters/locators" hx-get="/wms/masters/locators" hx-target="#main-workspace" hx-push-url="true" class="flex items-center gap-3 px-4 py-2 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-900/40 transition duration-200 cursor-pointer pl-6">
                        <i data-lucide="map-pin" class="w-3.5 h-3.5 text-amber-400"></i>
                        <span>Locators</span>
                    </a>
                    <a href="/wms/masters/uoms" hx-get="/wms/masters/uoms" hx-target="#main-workspace" hx-push-url="true" class="flex items-center gap-3 px-4 py-2 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-900/40 transition duration-200 cursor-pointer pl-6">
                        <i data-lucide="scale" class="w-3.5 h-3.5 text-blue-400"></i>
                        <span>Units of Measure</span>
                    </a>
                </nav>
            </div>

            <!-- Footer: User Context Info -->
            <div class="p-4 border-t border-slate-800 bg-slate-950/40">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-full bg-slate-900 flex items-center justify-center text-indigo-400 border border-slate-800 shadow-inner">
                        <i data-lucide="user" class="w-4 h-4"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h4 class="text-xs font-semibold text-slate-200 truncate">{{.Username}}</h4>
                        <span class="text-[10px] text-slate-400 capitalize tracking-wider">{{.UserRole}}</span>
                    </div>
                    <a href="/logout" class="p-1.5 rounded-lg hover:bg-slate-900/60 hover:text-rose-400 text-slate-400 transition" title="Logout">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                    </a>
                </div>
            </div>
        </aside>

        <!-- Right Side Panel Content -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <!-- Header Bar -->
            <header class="h-16 px-6 border-b border-slate-800/60 flex items-center justify-between glass-panel glow-border z-10 shrink-0">
                <div class="flex items-center gap-4">
                    <button class="md:hidden p-1.5 text-slate-400 hover:bg-slate-900 rounded-lg">
                        <i data-lucide="menu" class="w-5 h-5"></i>
                    </button>
                    <h2 class="font-bold text-sm text-slate-200 tracking-wide uppercase">Operational Center</h2>
                </div>
                
                <!-- Indicators & Location -->
                <div class="flex items-center gap-4 text-[10px] font-semibold">
                    <span class="flex items-center gap-2 bg-slate-950/80 px-3 py-1.5 rounded-full border border-slate-800">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span class="text-slate-400 tracking-wider">AUTH-STATELESS GATEWAY</span>
                    </span>
                    <span class="bg-indigo-950/40 text-indigo-400 border border-indigo-900/60 px-3 py-1.5 rounded-full tracking-widest uppercase">
                        WH-MAIN
                    </span>
                </div>
            </header>

            <!-- Render nested pages -->
            <div id="main-workspace" class="flex-1 overflow-y-auto bg-slate-950/10">
                {{template "content" .}}
            </div>
        </main>
    </div>

    <!-- Lucide Icons initialization -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
        
        // Listen to HTMX events to recreate icons on dynamic swaps
        document.body.addEventListener('htmx:afterSwap', function() {
            lucide.createIcons();
        });
    </script>
</body>
</html>
{{end}}
