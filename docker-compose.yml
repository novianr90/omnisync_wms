name: omnisync_wms

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omnisync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnisync_secret}
      POSTGRES_DB: ${POSTGRES_DB:-omnisync_wms}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omnisync} -d ${POSTGRES_DB:-omnisync_wms}"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth:
    build: 
      context: ./auth_services
      dockerfile: Dockerfile
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_TYPE=postgres
      - AUTH_DATABASE_URL=${AUTH_DATABASE_URL:-postgres://${POSTGRES_USER:-omnisync}:${POSTGRES_PASSWORD:-omnisync_secret}@postgres:5432/${POSTGRES_DB:-omnisync_wms}?sslmode=disable}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ALLOWED_ORIGIN=http://wms:9901,http://localhost:9901,http://localhost:80,https://${TUNNEL_DOMAIN:-omnisync.local}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  wms:
    build: 
      context: ./wms_dashboard
      dockerfile: Dockerfile
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_TYPE=postgres
      - WMS_DATABASE_URL=${WMS_DATABASE_URL:-postgres://${POSTGRES_USER:-omnisync}:${POSTGRES_PASSWORD:-omnisync_secret}@postgres:5432/${POSTGRES_DB:-omnisync_wms}?sslmode=disable}
      - AUTH_API_URL=http://auth:8000
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    ports:
      - "9901:9901"
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9901/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      wms:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx

volumes:
  postgres_data:
