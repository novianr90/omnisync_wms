name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Cancel redundant runs on the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────
  # Gate: Detect docs-only changes to skip heavy jobs
  # ──────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if changes are docs-only
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          else
            CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }})
          fi

          echo "Changed files:"
          echo "$CHANGED"

          # Docs-only if every changed file matches these patterns
          DOCS_ONLY=true
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.md|LICENSE|.gitignore|*.txt|docs/*|.github/workflows/*|*.diff|*.patch) ;;
              *) DOCS_ONLY=false; break ;;
            esac
          done <<< "$CHANGED"

          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"
          echo "Docs only: $DOCS_ONLY"

  # ──────────────────────────────────────────────────
  # Gate: Block forbidden files from entering the repo
  # ──────────────────────────────────────────────────
  file-blocker:
    name: File Blocker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block forbidden files
        run: |
          BLOCKED=false

          # Check for .env files (except .env.example)
          ENV_FILES=$(find . -name '.env' -o -name '.env.local' -o -name '.env.*.local' | grep -v '.env.example' || true)
          if [ -n "$ENV_FILES" ]; then
            echo "::error::❌ Forbidden .env files detected:"
            echo "$ENV_FILES"
            BLOCKED=true
          fi

          # Check for SQLite database files
          DB_FILES=$(find . -name '*.db' -o -name '*.db-journal' -o -name '*.db-shm' -o -name '*.db-wal' | head -20 || true)
          if [ -n "$DB_FILES" ]; then
            echo "::error::❌ Forbidden database files detected:"
            echo "$DB_FILES"
            BLOCKED=true
          fi

          # Check for compiled Go binaries
          EXE_FILES=$(find . -name '*.exe' -o -name '*.exe~' | head -20 || true)
          if [ -n "$EXE_FILES" ]; then
            echo "::error::❌ Forbidden binary files detected:"
            echo "$EXE_FILES"
            BLOCKED=true
          fi

          # Check for node_modules committed
          if [ -d "wms_dashboard/node_modules" ] && git ls-files --error-unmatch wms_dashboard/node_modules >/dev/null 2>&1; then
            echo "::error::❌ node_modules directory is committed!"
            BLOCKED=true
          fi

          # Check for diff/patch files
          DIFF_FILES=$(find . -name '*.diff' -o -name '*.patch' | head -20 || true)
          if [ -n "$DIFF_FILES" ]; then
            echo "::error::❌ Forbidden diff/patch files detected:"
            echo "$DIFF_FILES"
            BLOCKED=true
          fi

          # Check for pr_body.md metadata
          PR_BODY_FILES=$(find . -name 'pr_body.md' | head -20 || true)
          if [ -n "$PR_BODY_FILES" ]; then
            echo "::error::❌ Forbidden pr_body.md metadata files detected:"
            echo "$PR_BODY_FILES"
            BLOCKED=true
          fi

          if [ "$BLOCKED" = true ]; then
            echo ""
            echo "═══════════════════════════════════════════════════"
            echo "  Files above should be in .gitignore, not in the repo."
            echo "  Remove them with: git rm --cached <file>"
            echo "═══════════════════════════════════════════════════"
            exit 1
          fi

          echo "✅ No forbidden files detected."

  # ──────────────────────────────────────────────────
  # Go Lint: go vet for both services
  # ──────────────────────────────────────────────────
  lint:
    name: Go Lint
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.docs_only == 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: |
            auth_services/go.sum
            wms_dashboard/go.sum

      - name: Vet Auth Service
        working-directory: auth_services
        run: go vet ./...

      - name: Vet WMS Dashboard
        working-directory: wms_dashboard
        run: go vet ./...

  # ──────────────────────────────────────────────────
  # Unit Tests: go test for both services
  # ──────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.docs_only == 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: |
            auth_services/go.sum
            wms_dashboard/go.sum

      - name: Test Auth Service
        working-directory: auth_services
        run: go test -v -race -count=1 ./...

      - name: Test WMS Dashboard
        working-directory: wms_dashboard
        run: go test -v -race -count=1 ./...

  # ──────────────────────────────────────────────────
  # E2E Tests: Playwright against live Go services
  # ──────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.docs_only == 'false'
    env:
      JWT_SECRET_KEY: ci-test-signing-key-for-github-actions-12345
      DB_TYPE: postgres
      AUTH_DATABASE_URL: postgres://omnisync:test1234@localhost:5432/omnisync_test?sslmode=disable
      AUTH_API_URL: http://localhost:8000
      SEED_ADMIN_EMAIL: admin@omnisync.com
      SEED_ADMIN_PASSWORD: admin123
      SEED_OPERATOR_EMAIL: operator@omnisync.com
      SEED_OPERATOR_PASSWORD: operator123
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: omnisync
      PGPASSWORD: test1234
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omnisync
          POSTGRES_PASSWORD: test1234
          POSTGRES_DB: omnisync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: |
            auth_services/go.sum
            wms_dashboard/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: wms_dashboard/package-lock.json

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('wms_dashboard/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install NPM dependencies
        working-directory: wms_dashboard
        run: npm ci

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: wms_dashboard
        run: npx playwright install chromium

      - name: Install Playwright OS Dependencies
        working-directory: wms_dashboard
        run: npx playwright install-deps chromium

      - name: Pre-build Auth Service
        working-directory: auth_services
        run: go build -o auth_services ./cmd/main.go

      - name: Pre-build WMS Dashboard
        working-directory: wms_dashboard
        run: go build -o wms_dashboard ./cmd/main.go

      - name: Run Playwright E2E Tests
        working-directory: wms_dashboard
        run: CI=true npx playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: wms_dashboard/test-results/
          retention-days: 7

  # ──────────────────────────────────────────────────
  # Docker E2E: Build stack, run Playwright against nginx
  # ──────────────────────────────────────────────────
  docker-e2e:
    name: E2E Tests (Docker Stack)
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.docs_only == 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: wms_dashboard/package-lock.json

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('wms_dashboard/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install NPM dependencies
        working-directory: wms_dashboard
        run: npm ci

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: wms_dashboard
        run: npx playwright install chromium

      - name: Install Playwright OS Dependencies
        working-directory: wms_dashboard
        run: npx playwright install-deps chromium

      - name: Create .env for Docker Compose
        run: |
          cat > .env << 'EOF'
          APP_ENV=development
          DB_TYPE=postgres
          POSTGRES_USER=omnisync
          POSTGRES_PASSWORD=test1234
          POSTGRES_DB=omnisync_wms
          AUTH_DATABASE_URL=postgres://omnisync:test1234@postgres:5432/omnisync_wms?sslmode=disable
          WMS_DATABASE_URL=postgres://omnisync:test1234@postgres:5432/omnisync_wms?sslmode=disable
          JWT_SECRET_KEY=ci-test-signing-key-for-github-actions-12345
          ALLOWED_ORIGIN=http://localhost:9991
          SEED_ADMIN_EMAIL=admin@omnisync.com
          SEED_ADMIN_PASSWORD=admin123
          SEED_OPERATOR_EMAIL=operator@omnisync.com
          SEED_OPERATOR_PASSWORD=operator123
          EOF

      - name: Build and start Docker stack
        run: docker compose -f docker-compose.yml -f docker-compose.local-db.yml up -d --build

      - name: Wait for stack to be healthy
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:9991/health; do sleep 5; done'

      - name: Run Playwright E2E Tests against Docker stack
        working-directory: wms_dashboard
        env:
          DOCKER_STACK: "true"
          DB_TYPE: postgres
          JWT_SECRET_KEY: ci-test-signing-key-for-github-actions-12345
          SEED_ADMIN_EMAIL: admin@omnisync.com
          SEED_ADMIN_PASSWORD: admin123
          SEED_OPERATOR_EMAIL: operator@omnisync.com
          SEED_OPERATOR_PASSWORD: operator123
        run: CI=true npx playwright test --workers=1

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "=== Auth Logs ===" && docker logs omnisync_wms-auth-1 2>&1 || echo "(auth container not found)"
          echo "=== WMS Logs ===" && docker logs omnisync_wms-wms-1 2>&1 || echo "(wms container not found)"

      - name: Tear down Docker stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.local-db.yml down -v

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-docker
          path: wms_dashboard/test-results/
          retention-days: 7

  # ──────────────────────────────────────────────────
  # Required Gate: Single status check for branch protection
  # This job ALWAYS runs and is the only required check.
  # ──────────────────────────────────────────────────
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, file-blocker, lint, unit-tests, e2e-tests, docker-e2e]
    steps:
      - name: Evaluate pipeline result
        run: |
          echo "=== CI Gate Summary ==="
          echo "docs_only:    ${{ needs.changes.outputs.docs_only }}"
          echo "file-blocker: ${{ needs.file-blocker.result }}"
          echo "lint:         ${{ needs.lint.result }}"
          echo "unit-tests:   ${{ needs.unit-tests.result }}"
          echo "e2e-tests:    ${{ needs.e2e-tests.result }}"
          echo "docker-e2e:   ${{ needs.docker-e2e.result }}"
          echo "======================="

          # File blocker must always pass
          if [ "${{ needs.file-blocker.result }}" != "success" ]; then
            echo "❌ File blocker failed — forbidden files detected."
            exit 1
          fi

          # Docs-only: lint/test/e2e are skipped, that's OK
          if [ "${{ needs.changes.outputs.docs_only }}" = "true" ]; then
            echo "📄 Docs-only change — tests were skipped. ✅"
            exit 0
          fi

          # Code change: all test jobs must have succeeded
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "❌ Lint failed."
            exit 1
          fi

          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "❌ Unit tests failed."
            exit 1
          fi

          if [ "${{ needs.e2e-tests.result }}" != "success" ]; then
            echo "❌ E2E tests failed."
            exit 1
          fi

          if [ "${{ needs.docker-e2e.result }}" != "success" ]; then
            echo "❌ Docker E2E tests failed."
            exit 1
          fi

          echo "✅ All checks passed!"
